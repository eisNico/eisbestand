<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>Eistabelle</title>
  <script>
    if (window.matchMedia('(display-mode: standalone)').matches) {
      if (!location.href.includes("homescreen=1")) {
        location.replace("index.html?homescreen=1");
      }
    }
  </script>
</head>
<body>
  <div id="loginScreen">
    <h2>Bitte Passwort eingeben</h2>
    <input type="password" id="passwordInput" placeholder="Passwort" onkeydown="if(event.key==='Enter') checkPassword()" />
    <button onclick="checkPassword()">Bestätigen</button>
    <p id="loginError" style="color:red; display:none;">Falsches Passwort!</p>
  </div>

  <div id="app" style="display:none;">
    <h1 class="title">Eistabelle</h1>

    <div style="margin-bottom: 1em;">
      <label for="statusFilter">Status filtern:</label>
      <select id="statusFilter" onchange="applyFilter()">
        <option value="alle">Alle</option>
        <option value="⬜">⬜ Offen</option>
        <option value="❌">❌ Gestrichen</option>
        <option value="✔️">✔️ Erledigt</option>
      </select>
    </div>

    <div class="table-container">
      <table id="eisTable">
        <thead>
          <tr>
            <th class="col-small">Status</th>
            <th class="col-name">Eissorte</th>
            <th class="col-small">Laden</th>
            <th class="col-small">Lager</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="button-group">
      <button onclick="showDeleteModal()">🗑️ Löschen</button>
      <button onclick="addRow()">+ Neue Sorte</button>
      <button onclick="saveData()">Speichern</button>
      <div id="saveNotice">Gespeichert!</div>
    </div>

    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <h3>Welche Eissorte möchtest du löschen?</h3>
        <select id="deleteSelect"></select><br><br>
        <button onclick="deleteRow()">Löschen</button>
        <button onclick="hideDeleteModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <footer style="font-size:10px; margin-top:2em;">
    Icon von <a href="https://icons8.com" target="_blank" style="color:white;">Icons8</a>
  </footer>
</body>
</html>
